[pytest]
addopts = -ra --strict-markers
testpaths = tests
markers =
    contract: response shape and API contract checks
    negative: invalid input, authorization, and error handling checks
    known_bug: tests that document current production-blocking defects
    known_bug_high: high-severity known defects that block release
    known_bug_low: medium/low known defects and UX risks tracked as diagnostics
    security: authorization, authentication, signature, and data-integrity checks
    data_management: test data isolation and state management checks
