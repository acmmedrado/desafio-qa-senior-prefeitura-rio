services:
  catalog-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
