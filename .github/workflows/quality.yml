name: quality

on:
  push:
  pull_request:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start API
        working-directory: api
        run: docker compose up -d --build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Lint test code
        run: |
          ruff check tests scripts
          ruff format --check tests scripts

      - name: Run functional API tests
        run: |
          mkdir -p reports
          pytest -m "not known_bug" \
            --junitxml=reports/pytest-junit.xml \
            --html=reports/pytest-report.html \
            --self-contained-html

      - name: Collect release-blocking known bug evidence
        if: always()
        run: |
          pytest -m "known_bug_high or security" \
            --junitxml=reports/release-gate-junit.xml \
            --html=reports/release-gate-report.html \
            --self-contained-html || true

      - name: Run non-blocking known bug diagnostics
        if: always()
        run: |
          pytest -m "known_bug and not (known_bug_high or security)" \
            --junitxml=reports/known-bugs-junit.xml \
            --html=reports/known-bugs-report.html \
            --self-contained-html || true

      - name: Generate quality summary
        if: always()
        run: |
          python scripts/quality_summary.py
          cat reports/quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload functional test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-reports
          path: reports/
          retention-days: 14

      - name: Run k6 performance smoke
        if: always()
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -v "$PWD:/workspace" \
            grafana/k6:0.49.0 run /workspace/performance/catalog-api.k6.js

      - name: Run scheduled k6 spike
        if: always() && github.event_name == 'schedule'
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -v "$PWD:/workspace" \
            grafana/k6:0.49.0 run /workspace/performance/spike.k6.js

      - name: Stop API
        if: always()
        working-directory: api
        run: docker compose down -v
